{% extends 'base.html' %}

{% block title %}Dodaj zadanie transkrypcji{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto px-4 py-10">
    <a href="{% url 'groby:transkrypcje' %}" class="text-sm text-primary-600 hover:underline">← lista zadań</a>
    <div class="text-xs uppercase tracking-widest text-accent-600 mt-2">Crowdsourcing</div>
    <h1 class="font-serif text-3xl text-primary-900 mb-6">Dodaj zadanie transkrypcji</h1>

    <div class="bg-white rounded-lg shadow-soft border border-cream-200 p-6">
        {% if messages %}{% for m in messages %}<div class="mb-3 p-3 rounded text-sm bg-red-50 border border-red-200 text-red-800">{{ m }}</div>{% endfor %}{% endif %}

        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {{ antybot_html|safe }}
            <div>
                <label class="block text-sm font-medium text-primary-700 mb-1">Zdjęcie nieczytelnego fragmentu</label>
                <input type="file" name="foto" accept="image/*" required class="w-full">
            </div>
            <div>
                <label class="block text-sm font-medium text-primary-700 mb-1">Opis (co widać, gdzie na nagrobku)</label>
                <input type="text" name="opis" maxlength="300" required class="w-full px-3 py-2 border border-cream-200 rounded">
            </div>
            <div>
                <label class="block text-sm font-medium text-primary-700 mb-1">ID grobu (opcjonalnie)</label>
                <input type="number" name="grob_id" class="w-32 px-3 py-2 border border-cream-200 rounded">
            </div>
            <button type="submit" class="px-5 py-2 bg-primary-700 text-white rounded hover:bg-primary-800">Wyślij</button>
        </form>
    </div>
</section>
{% endblock %}
